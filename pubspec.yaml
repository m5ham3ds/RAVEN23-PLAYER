name: raven23_player
description: Standalone companion video player for the RAVEN23 ecosystem.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.9.0 <4.0.0"
dependencies:
  easy_localization: ^3.0.7
  flutter_dotenv: ^5.2.1
  provider: ^6.1.2
  phosphor_flutter: ^2.1.0
  raven23:
    git:
      url: https://github.com/m5ham3ds/RAVEN23.git
      ref: player-package-compat
  better_player_plus:
    git:
      url: https://github.com/BeamlakAschalew/flixquest-betterplayer.git
      ref: main
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  path: ^1.9.1
  path_provider: ^2.1.4
  share_plus: ^10.1.1
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/translations/
