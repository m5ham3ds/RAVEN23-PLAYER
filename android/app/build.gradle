plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.m5ham3ds.raven23.player"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.m5ham3ds.raven23.player"
        minSdk flutter.minSdkVersion
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }
}

flutter {
    source "../.."
}
