plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeystorePath = System.getenv("RAVEN23_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("RAVEN23_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("RAVEN23_KEY_ALIAS")
def releaseKeyPassword = System.getenv("RAVEN23_KEY_PASSWORD")
def hasReleaseSigning = [
    releaseKeystorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { value -> value != null && !value.isBlank() }

android {
    namespace "com.m5ham3ds.raven23.player"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.m5ham3ds.raven23.player"
        minSdk flutter.minSdkVersion
        targetSdk 36
        versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionName "0.1.0"
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // Required by flutter_local_notifications for Java 8+ APIs on older Android.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
