name: Android CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raven23-player-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Generate Android Gradle wrapper
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          values = {}
          path = Path("local.properties")
          if path.exists():
              for raw in path.read_text().splitlines():
                  line = raw.strip()
                  if line and not line.startswith("#") and "=" in line:
                      key, value = line.split("=", 1)
                      values[key.strip()] = value.strip()
          values["flutter.sdk"] = os.environ["FLUTTER_ROOT"]
          values["sdk.dir"] = os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", ""))
          path.write_text("".join(key + "=" + value + "\n" for key, value in values.items()))
          PYTHON
          gradle --no-watch-fs --no-daemon wrapper --gradle-version 8.14 --distribution-type all
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Format Dart sources
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Unit tests
        run: flutter test --no-pub --reporter expanded

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raven23-player-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
