name: Android CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raven23-player-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Generate Android Gradle wrapper
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          values = {}
          path = Path("local.properties")
          if path.exists():
              for raw in path.read_text().splitlines():
                  line = raw.strip()
                  if line and not line.startswith("#") and "=" in line:
                      key, value = line.split("=", 1)
                      values[key.strip()] = value.strip()
          values["flutter.sdk"] = os.environ["FLUTTER_ROOT"]
          values["sdk.dir"] = os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", ""))
          path.write_text("".join(key + "=" + value + "\n" for key, value in values.items()))
          PYTHON
          gradle --no-watch-fs --no-daemon wrapper --gradle-version 8.14 --distribution-type all
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Format Dart sources
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Unit tests
        run: flutter test --no-pub --reporter expanded

      - name: Build installable ARM64 APK
        id: apk
        shell: bash
        env:
          RAVEN23_KEYSTORE_BASE64: ${{ secrets.RAVEN23_KEYSTORE_BASE64 }}
          RAVEN23_KEYSTORE_PASSWORD: ${{ secrets.RAVEN23_KEYSTORE_PASSWORD }}
          RAVEN23_KEY_ALIAS: ${{ secrets.RAVEN23_KEY_ALIAS }}
          RAVEN23_KEY_PASSWORD: ${{ secrets.RAVEN23_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for value in "$RAVEN23_KEYSTORE_BASE64" "$RAVEN23_KEYSTORE_PASSWORD" "$RAVEN23_KEY_ALIAS" "$RAVEN23_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              present=$((present + 1))
            fi
          done

          if [[ "$present" -eq 4 ]]; then
            keystore="$RUNNER_TEMP/raven23-player-release.jks"
            printf '%s' "$RAVEN23_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            test -s "$keystore"
            export RAVEN23_KEYSTORE_PATH="$keystore"
            flutter build apk --release --target-platform android-arm64 --no-pub
            apk_path="build/app/outputs/flutter-apk/app-release.apk"
            build_kind="release"
          elif [[ "$present" -eq 0 ]]; then
            echo "::notice::No release keystore secrets configured; building an installable debug-signed preview APK."
            flutter build apk --debug --target-platform android-arm64 --no-pub
            apk_path="build/app/outputs/flutter-apk/app-debug.apk"
            build_kind="debug"
          else
            echo "::error::Release signing secrets are incomplete. Configure all four RAVEN23 signing secrets or remove all four to build a debug preview."
            exit 1
          fi

          test -s "$apk_path"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk_path"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk_path" | grep -F "package: name='com.m5ham3ds.raven23.player'"
          unzip -Z1 "$apk_path" | grep -q '^lib/arm64-v8a/libapp.so$'
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "build_kind=$build_kind" >> "$GITHUB_OUTPUT"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: raven23-player-arm64-${{ steps.apk.outputs.build_kind }}-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
